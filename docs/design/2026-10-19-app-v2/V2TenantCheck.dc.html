<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>입주 기록 확인</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}
a:focus-visible,button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid #0B6655;outline-offset:2px}
input::placeholder,textarea::placeholder{color:#868B94}
</style>
</helmet>
<div style="width: 390px; height: 900px; box-sizing: border-box; position: relative; overflow: hidden; display: flex; flex-direction: column; background: #FFFFFF; font-family: Pretendard, 'Pretendard Variable', 'Noto Sans KR', 'Apple SD Gothic Neo', sans-serif; color: #212124; -webkit-font-smoothing: antialiased; word-break: keep-all;">
<header style="height: 56px; flex: none; box-sizing: border-box; padding: 0 12px 0 6px; display: flex; align-items: center; gap: 2px; border-bottom: 1px solid #EAEBEE;"><a href="V2Home.dc.html" aria-label="뒤로" style="width: 44px; height: 44px; display: grid; place-items: center;"><svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"></path></svg></a><h1 style="margin: 0; flex: 1; font-size: 18px; font-weight: 700;">입주 기록 확인하기</h1></header>
  <main style="flex: 1; overflow: hidden; padding: 12px 16px 16px; display: flex; flex-direction: column; gap: 12px;">
    <p style="margin: 0; padding: 12px 14px; border-radius: 8px; background: #F2F3F6; font-size: 15px; line-height: 1.6;">공릉공인중개사가 □□빌라 102호 입주 상태를 보냈어요. 항목마다 맞는지 봐 주세요. 다르면 의견을 남기면 원본 옆에 함께 남아요.</p>
    <sc-for list="{{items}}" as="it" hint-placeholder-count="3">
      <div style="display: flex; flex-direction: column; gap: 8px; padding-bottom: 12px; border-bottom: 1px solid #EAEBEE;">
        <div style="display: flex; gap: 12px;"><img src="{{it.img}}" alt="{{it.alt}}" style="width: 72px; height: 72px; border-radius: 8px; object-fit: cover; flex: none;"><span style="display: flex; flex-direction: column; gap: 3px;"><strong style="font-size: 16px;">{{it.name}}</strong><span style="font-size: 14px; color: #4D5159;">{{it.note}}</span><span style="{{it.statusStyle}}">{{it.status}}</span></span></div>
        <div style="display: flex; gap: 6px;"><button type="button" onClick="{{it.ok}}" style="flex: 1; height: 42px; border-radius: 8px; border: 1px solid #DCDEE3; background: #FFFFFF; font: inherit; font-size: 15px; font-weight: 600; cursor: pointer;">맞아요</button><button type="button" onClick="{{it.note2}}" style="flex: 1; height: 42px; border-radius: 8px; border: 1px solid #DCDEE3; background: #FFFFFF; font: inherit; font-size: 15px; font-weight: 600; cursor: pointer;">다르면 의견 남기기</button></div>
        <sc-if value="{{it.hasComment}}" hint-placeholder-val="{{ false }}"><span style="padding: 10px 12px; border-radius: 8px; background: #FDF6EA; font-size: 14px;">내 의견: "긁힘은 입주 전부터 있었어요. 길이는 40cm 정도예요." · 원본 옆에 남음</span></sc-if>
      </div>
    </sc-for>
    <p style="margin: 0; font-size: 14px; color: #6B7079;">답하지 않은 항목은 "답 없음"으로 남아요. 동의한 것으로 보지 않아요.</p>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":900}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { s: {} }; }
  renderVals() {
    const s = this.state.s;
    const data = [['거실 · 벽지', '창문 옆 30cm 긁힘 1곳', '/_blob/2ec67eff6ee53ed2f05f8214a92c0d81'], ['거실 · 바닥', '소파 자리 눌림 자국', '/_blob/af22ec8ccb40b1c19d9c4a9293a52a25'], ['욕실 · 타일', '줄눈 곰팡이 조금', '/_blob/197e97cd5dc3e25e84af0c61c9f2a06d']];
    const look = { ok: ['확인함', '#E3F0EC', '#083E37'], note: ['의견 있음', '#FDF0DF', '#7A4A00'], none: ['답 없음', '#F2F3F6', '#4D5159'] };
    const items = data.map(([name, note, img], i) => { const k = s[i] || 'none'; const [t, bg, fg] = look[k];
      return { name, note, img, alt: name + ' 사진', status: t, statusStyle: 'align-self:flex-start;padding:2px 8px;border-radius:4px;font-size:13px;font-weight:700;background:' + bg + ';color:' + fg + ';', hasComment: k === 'note', ok: () => this.setState({ s: { ...s, [i]: 'ok' } }), note2: () => this.setState({ s: { ...s, [i]: 'note' } }) }; });
    return { items };
  }
}
</script>
</body>
</html>
