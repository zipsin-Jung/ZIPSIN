<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>서류 올리기</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}
a:focus-visible,button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid #0B6655;outline-offset:2px}
input::placeholder,textarea::placeholder{color:#868B94}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; display: flex; flex-direction: column; background: #FFFFFF; font-family: Pretendard, 'Pretendard Variable', 'Noto Sans KR', 'Apple SD Gothic Neo', sans-serif; color: #212124; -webkit-font-smoothing: antialiased; word-break: keep-all;">
<header style="height: 56px; flex: none; box-sizing: border-box; padding: 0 12px 0 6px; display: flex; align-items: center; gap: 2px; border-bottom: 1px solid #EAEBEE;"><a href="V2Partner.dc.html" aria-label="뒤로" style="width: 44px; height: 44px; display: grid; place-items: center;"><svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"></path></svg></a><h1 style="margin: 0; flex: 1; font-size: 18px; font-weight: 700;">공인중개사무소 등록</h1></header>
  <main style="flex: 1; overflow: hidden; padding: 14px 16px 20px; display: flex; flex-direction: column; gap: 12px;">
    <label for="on" style="display: flex; flex-direction: column; gap: 6px; font-size: 15px; font-weight: 600;">사무소 이름<input id="on" value="공릉공인중개사사무소" style="height: 50px; border: 1px solid #DCDEE3; border-radius: 8px; padding: 0 14px; font: inherit; font-size: 16px; font-weight: 400;"></label>
    <span style="font-size: 15px; font-weight: 600;">필수 서류 (사진)</span>
    <sc-for list="{{docs}}" as="d" hint-placeholder-count="3">
      <button type="button" onClick="{{d.up}}" style="{{d.style}}"><span style="display: flex; flex-direction: column; align-items: flex-start; gap: 2px;"><strong style="font-size: 16px;">{{d.name}}</strong><span style="font-size: 14px; color: #6B7079;">{{d.sub}}</span></span><span style="{{d.tagStyle}}">{{d.tag}}</span></button>
    </sc-for>
    <p style="margin: 0; font-size: 14px; line-height: 1.6; color: #6B7079;">집신 담당자가 서류를 확인해요. 확인이 끝나면 서류 사진을 어떻게 보관할지는 법률 확인 뒤 정해요.</p>
    <sc-if value="{{ready}}" hint-placeholder-val="{{ false }}"><a href="V2PartnerWait.dc.html" style="height: 52px; border-radius: 8px; background: #0B6655; color: #FFFFFF; display: grid; place-items: center; font-size: 16px; font-weight: 700; margin-top: auto;">확인 요청 보내기</a></sc-if>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { up: { 0: true } }; }
  renderVals() {
    const up = this.state.up;
    const list = [['사업자등록증', '대표자 이름이 보이게'], ['중개사무소 등록증', '시·군·구에서 받은 것'], ['대표 공인중개사 자격증', '대표자 본인 것']];
    const docs = list.map(([name, sub], i) => ({ name, sub, up: () => this.setState({ up: { ...up, [i]: true } }),
      style: 'min-height:68px;padding:10px 14px;border-radius:12px;font:inherit;text-align:left;cursor:pointer;display:flex;justify-content:space-between;align-items:center;' + (up[i] ? 'border:1px solid #0B6655;background:#F2F8F6;' : 'border:1px dashed #B0B3BA;background:#FFFFFF;'),
      tag: up[i] ? '올림 ✓' : '사진 올리기', tagStyle: 'font-size:14px;font-weight:700;color:' + (up[i] ? '#0B6655' : '#212124') + ';' }));
    return { docs, ready: [0, 1, 2].every(i => up[i]) };
  }
}
</script>
</body>
</html>
