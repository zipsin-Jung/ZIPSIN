<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>수리</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}
a:focus-visible,button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid #0B6655;outline-offset:2px}
input::placeholder,textarea::placeholder{color:#868B94}
</style>
</helmet>
<div style="width: 390px; height: 900px; box-sizing: border-box; position: relative; overflow: hidden; display: flex; flex-direction: column; background: #FFFFFF; font-family: Pretendard, 'Pretendard Variable', 'Noto Sans KR', 'Apple SD Gothic Neo', sans-serif; color: #212124; -webkit-font-smoothing: antialiased; word-break: keep-all;">
<header style="height: 56px; flex: none; box-sizing: border-box; padding: 0 12px 0 6px; display: flex; align-items: center; gap: 2px; border-bottom: 1px solid #EAEBEE;"><a href="V2HomeView.dc.html" aria-label="뒤로" style="width: 44px; height: 44px; display: grid; place-items: center;"><svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"></path></svg></a><h1 style="margin: 0; flex: 1; font-size: 18px; font-weight: 700;">수리 · 싱크대 수전 물샘</h1></header>
  <main style="flex: 1; overflow: hidden; padding: 14px 16px; display: flex; flex-direction: column; gap: 14px;">
    <ol style="margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column;">
      <sc-for list="{{steps}}" as="s" hint-placeholder-count="5">
        <li style="display: flex; gap: 12px; min-height: 58px;"><span style="display: flex; flex-direction: column; align-items: center; width: 24px; flex: none;"><span style="{{s.dot}}">{{s.mark}}</span><span style="{{s.line}}"></span></span><span style="display: flex; flex-direction: column; gap: 2px;"><strong style="{{s.ls}}">{{s.label}}</strong><span style="font-size: 14px; color: #6B7079;">{{s.desc}}</span></span></li>
      </sc-for>
    </ol>
    <sc-if value="{{notDone}}" hint-placeholder-val="{{ true }}"><button type="button" onClick="{{next}}" style="height: 52px; border: 0; border-radius: 8px; background: #0B6655; color: #fff; font: inherit; font-size: 16px; font-weight: 700; cursor: pointer;">{{nextLabel}}</button></sc-if>
    <sc-if value="{{done}}" hint-placeholder-val="{{ false }}"><a href="V2History.dc.html" style="height: 52px; border-radius: 8px; background: #0B6655; color: #fff; display: grid; place-items: center; font-size: 16px; font-weight: 700;">집 이력에 남기기 (임대인 승인)</a></sc-if>
    <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px;"><img src="/_blob/7d72f3c925be8178514fa7241c7261d6" alt="수리 전 사진" style="width: 100%; aspect-ratio: 1; border-radius: 8px; object-fit: cover;"><img src="/_blob/2ec67eff6ee53ed2f05f8214a92c0d81" alt="수리 전 사진 2" style="width: 100%; aspect-ratio: 1; border-radius: 8px; object-fit: cover;"><span style="aspect-ratio: 1; border-radius: 8px; border: 1px dashed #B0B3BA; display: grid; place-items: center; font-size: 14px; color: #6B7079; text-align: center;">수리 후<br>사진</span></div>
    <p style="margin: 0; font-size: 14px; color: #6B7079;">단계마다 날짜와 누른 사람이 자동으로 남아요.</p>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":900}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { step: 1 }; }
  renderVals() {
    const step = this.state.step;
    const list = [['접수', '10월 15일 · 임차인 사진 2장'], ['임대인 확인', '임대인이 수리를 승인해요'], ['일정 조율', '기사 방문 날짜를 정해요'], ['수리 완료', '고친 뒤 사진을 남겨요'], ['영수증 첨부', '금액과 영수증을 붙이면 끝']];
    const steps = list.map(([label, desc], i) => { const past = i < step, cur = i === step;
      return { label, desc, mark: past ? '✓' : String(i + 1),
        dot: 'width:24px;height:24px;border-radius:12px;display:grid;place-items:center;font-size:12px;font-weight:700;box-sizing:border-box;' + (past ? 'background:#0B6655;color:#fff;' : cur ? 'background:#C98A2E;color:#fff;' : 'background:#fff;border:2px solid #DCDEE3;color:#6B7079;'),
        line: i === list.length - 1 ? 'display:none;' : 'flex:1;width:2px;min-height:18px;background:' + (past ? '#0B6655' : '#EAEBEE') + ';',
        ls: 'font-size:16px;' + (cur ? 'font-weight:700;color:#7A4A00;' : past ? 'font-weight:600;' : 'font-weight:500;color:#6B7079;') }; });
    const labels = ['임대인에게 확인 요청', '확인했어요 (임대인)', '일정 확정하기', '수리 완료로 바꾸기', '영수증 첨부하고 끝내기'];
    return { steps, nextLabel: labels[step] || '', done: step >= 5, notDone: step < 5, next: () => this.setState({ step: Math.min(5, step + 1) }) };
  }
}
</script>
</body>
</html>
